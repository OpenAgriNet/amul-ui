server {
	listen 8080;
	root /usr/share/nginx/html;
	server_tokens off;

	# Only server-level add_header: a location with its own add_header would drop these.
	add_header Cache-Control "no-cache" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy same-origin always;

	# Probes from the kubelet, which reach this container directly (not through oauth2-proxy).
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
